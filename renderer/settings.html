<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title data-i18n="settings.windowTitle">IA Hypermiler — Settings</title>
  <link rel="stylesheet" href="settings.css" />
</head>
<body>
  <!--
    Visible text: English default in the markup, translated at runtime from the
    data-i18n* attributes (renderer/i18n). Brand/product names and option values
    that are proper names (Claude, Pro, Max 5x, Personal Access Token…) are not
    translated.
  -->
  <main id="settings-app">
    <h1 data-i18n="settings.title">Settings</h1>

    <section class="card">
      <h2 data-i18n="settings.accounts.title">Accounts</h2>
      <table class="accounts-table">
        <thead>
          <tr>
            <th data-i18n="settings.accounts.colName">Name</th>
            <th data-i18n="settings.accounts.colProvider">Provider</th>
            <th data-i18n="settings.accounts.colStatus">Status</th>
            <th data-i18n="settings.accounts.colActive">Active</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="accounts-tbody">
          <!-- generated by settings.js (renderAccountsTable); until then a loading row:
               the main process can be busy for a moment at startup. -->
          <tr><td colspan="5" class="loading-cell" data-i18n="settings.loading">Loading…</td></tr>
        </tbody>
      </table>
      <p class="hint" id="accounts-empty" data-i18n="settings.accounts.empty" hidden>No accounts yet: add one below.</p>
      <div class="field-row add-account-row">
        <select id="add-account-provider" aria-label="Provider of the new account" data-i18n-aria-label="settings.accounts.providerAria">
          <option value="claude">Claude</option>
          <option value="copilot">GitHub Copilot</option>
        </select>
        <button type="button" class="btn-secondary" id="btn-add-account" data-i18n="settings.accounts.add" disabled>Add account</button>
      </div>
      <p class="hint" data-i18n="settings.accounts.hint">You can connect several accounts, even of the same provider.</p>
    </section>

    <!--
      Per-provider detail panels (issue #4: common part + provider-specific part).
      Cloned by settings.ts for every account: each [data-account-field] becomes
      data-field="accounts.<index>.<field>", reusing the generic form saving.
    -->
    <!-- Work schedule of one account, cloned at the end of every account detail
         (schedule-slot), collapsed with a one-line summary. -->
    <template id="tpl-work-schedule">
      <details class="account-schedule">
        <summary>
          <span class="account-schedule-title" data-i18n="settings.schedule.title">Work schedule</span>
          <span class="account-schedule-summary" data-role="schedule-summary"></span>
        </summary>
        <label>
          <input type="checkbox" data-account-field="workSchedule.enabled" />
          <span data-i18n="settings.schedule.enabled">Limit pacing to specific days/hours of the week</span>
        </label>
        <p class="hint" data-role="schedule-disabled-hint" data-i18n="settings.schedule.disabledHint" hidden></p>
        <div class="week-grid" data-role="week-grid"><!-- generated by settings.ts --></div>
        <label><span data-i18n="settings.schedule.hoursPerDay">Working hours per day</span>
          <input type="number" min="1" max="24" step="0.5" data-account-field="workSchedule.hoursPerDay" />
        </label>
      </details>
    </template>

    <template id="tpl-detail-claude">
      <div class="account-detail">
        <div class="field-row">
          <label><span data-i18n="settings.account.name">Account name</span>
            <input type="text" data-account-field="label" />
          </label>
          <label><span data-i18n="settings.account.scope">Account scope</span>
            <select data-account-field="accountScope">
              <option value="personal" data-i18n="settings.account.scopePersonal">Personal</option>
              <option value="organization" data-i18n="settings.account.scopeOrg">Company (organization seat)</option>
            </select>
          </label>
        </div>
        <div class="field-row">
          <label><span data-i18n="settings.claude.loginMethod">Login method</span>
            <select data-account-field="authMethod">
              <option value="password" data-i18n="settings.claude.loginPassword">Email and password</option>
              <option value="google">Google</option>
              <option value="sso" data-i18n="settings.claude.loginSso">Company SSO</option>
            </select>
          </label>
          <label><span data-i18n="settings.account.plan">Plan</span>
            <select data-account-field="planTier">
              <option value="free">Free</option>
              <option value="pro">Pro</option>
              <option value="max_5x">Max 5x</option>
              <option value="max_20x">Max 20x</option>
              <option value="team">Team</option>
              <option value="enterprise">Enterprise</option>
            </select>
          </label>
        </div>
        <label><span data-i18n="settings.account.renewalDay">Renewal day (of the month)</span>
          <input type="number" min="1" max="31" data-account-field="subscription.renewalRule.day" />
        </label>
        <p class="hint" data-role="renewal-hint" hidden></p>
        <label>
          <input type="checkbox" data-account-field="localInsights" data-local-insights />
          <span data-i18n="settings.claude.localInsights">Attribute this machine’s Claude Code sessions to this account</span>
        </label>
        <p class="hint" data-i18n="settings.claude.localInsightsHint"></p>
        <p class="hint" data-i18n="settings.claude.loginHint"></p>
        <div data-role="schedule-slot"></div>
      </div>
    </template>

    <template id="tpl-detail-copilot">
      <div class="account-detail">
        <div class="field-row">
          <label><span data-i18n="settings.account.name">Account name</span>
            <input type="text" data-account-field="label" />
          </label>
          <label><span data-i18n="settings.account.scope">Account scope</span>
            <select data-account-field="accountScope">
              <option value="personal" data-i18n="settings.account.scopePersonal">Personal</option>
              <option value="organization" data-i18n="settings.account.scopeOrg">Company (organization seat)</option>
            </select>
          </label>
        </div>
        <p class="warning" data-role="org-warning" data-i18n="settings.copilot.orgWarning" hidden></p>
        <label><span data-i18n="settings.copilot.host">GitHub domain</span>
          <input type="text" data-account-field="host" data-role="github-host" placeholder="github.com" spellcheck="false" />
        </label>
        <p class="hint" data-i18n="settings.copilot.hostHint"></p>
        <div class="field-row">
          <label><span data-i18n="settings.account.plan">Plan</span>
            <select data-account-field="planTier">
              <option value="free">Free</option>
              <option value="individual" data-i18n="settings.copilot.planIndividual">Individual (Pro)</option>
              <option value="pro_plus">Pro+</option>
              <option value="business">Business</option>
              <option value="enterprise">Enterprise</option>
            </select>
          </label>
          <label><span data-i18n="settings.account.renewalDay">Renewal day (of the month)</span>
            <input type="number" min="1" max="31" data-account-field="subscription.renewalRule.day" />
          </label>
        </div>
        <p class="hint" data-role="renewal-hint" hidden></p>
        <label><span data-i18n="settings.copilot.manualQuota">Monthly premium request quota</span>
          <input type="number" min="0" data-account-field="manualQuota" />
        </label>
        <label><span data-i18n="settings.copilot.authMethod">Authentication method</span>
          <select data-account-field="authMethod">
            <option value="pat">Personal Access Token</option>
            <option value="oauth" data-i18n="settings.copilot.authOauth">GitHub OAuth (experimental)</option>
          </select>
        </label>

        <div data-role="pat-panel">
          <label>
            <span class="label-row">
              Personal Access Token
              <button type="button" class="info-icon" aria-label="How to get a token" data-i18n-aria-label="settings.copilot.patHelpAria">
                ⓘ
                <span class="tooltip" role="tooltip">
                  <strong data-i18n="settings.copilot.patHelpFineGrained">Fine-grained:</strong>
                  <span data-i18n="settings.copilot.patHelpFineGrainedSteps"></span><br />
                  <strong data-i18n="settings.copilot.patHelpClassic">Classic:</strong>
                  <span data-i18n="settings.copilot.patHelpClassicSteps"></span>
                </span>
              </button>
            </span>
            <input type="password" data-role="token-input" placeholder="github_pat_… or ghp_…" data-i18n-placeholder="settings.copilot.patPlaceholder" />
          </label>
          <div class="field-row connect-row">
            <button type="button" class="btn-secondary" data-action="connect-copilot-pat" data-i18n="settings.copilot.saveToken">Save token</button>
          </div>
          <p class="hint" data-i18n="settings.copilot.patHint"></p>
        </div>

        <div data-role="oauth-panel">
          <label>
            <span class="label-row">
              <span data-i18n="settings.copilot.oauthTitle">Sign in with GitHub OAuth</span>
              <button type="button" class="info-icon" aria-label="How to set up OAuth access" data-i18n-aria-label="settings.copilot.oauthHelpAria">
                ⓘ
                <span class="tooltip" role="tooltip">
                  <span data-i18n="settings.copilot.oauthHelpBefore"></span>
                  <strong>http://127.0.0.1:8123/callback</strong>.
                  <span data-i18n="settings.copilot.oauthHelpAfter"></span>
                </span>
              </button>
            </span>
          </label>
          <p class="hint" data-i18n="settings.copilot.oauthHint"></p>
          <div class="field-row">
            <label>Client ID
              <input type="text" data-account-field="oauthApp.clientId" data-role="oauth-client-id" placeholder="Iv1.xxxxxxxxxxxxxxxx" />
            </label>
            <label>Client Secret
              <input type="password" data-role="oauth-secret-input" placeholder="never saved to disk" data-i18n-placeholder="settings.copilot.clientSecretPlaceholder" />
            </label>
          </div>
          <div class="field-row connect-row">
            <button type="button" class="btn-secondary" data-action="connect-copilot-oauth" data-i18n="settings.copilot.oauthConnect">Connect with GitHub (OAuth)</button>
          </div>
        </div>
        <div data-role="schedule-slot"></div>
        <p class="hint" data-role="detail-status"></p>
      </div>
    </template>


    <section class="card">
      <h2 data-i18n="settings.appearance.title">Appearance</h2>
      <div class="field-row">
        <label><span data-i18n="settings.appearance.language">Language</span>
          <select data-field="ui.language">
            <option value="auto" data-i18n="settings.appearance.languageAuto">Automatic (system language)</option>
            <option value="en">English</option>
            <option value="it">Italiano</option>
          </select>
        </label>
        <label><span data-i18n="settings.appearance.windowStyle">Window style</span>
          <select data-field="ui.windowStyle">
            <option value="filled" data-i18n="settings.appearance.styleFilled">Filled (classic - light)</option>
            <option value="filled-dark" data-i18n="settings.appearance.styleFilledDark">Filled (dark)</option>
            <option value="transparent-digital" data-i18n="settings.appearance.styleTransparent">Transparent / digital</option>
          </select>
        </label>
      </div>
      <div class="field-row">
        <label><span data-i18n="settings.appearance.chartRange">Chart range</span>
          <select data-field="ui.chartRange">
            <option value="week" data-i18n="settings.appearance.week">Week</option>
            <option value="month" data-i18n="settings.appearance.month">Month</option>
          </select>
        </label>
        <label><span data-i18n="settings.appearance.accentColor">Accent color</span> <input type="color" data-field="ui.accentColor" /></label>
      </div>
      <div class="field-row">
        <label><input type="checkbox" data-field="ui.alwaysOnTop" /> <span data-i18n="settings.appearance.alwaysOnTop">Always on top</span></label>
      </div>
    </section>

    <section class="card">
      <h2 data-i18n="settings.notifications.title">Notifications</h2>
      <label><span data-i18n="settings.notifications.threshold">Alert threshold (%)</span>
        <input type="number" min="1" max="100" data-field="ui.notificationThresholdPercent" />
      </label>
    </section>

    <section class="card" id="updates-card">
      <h2 data-i18n="settings.updates.title">Updates</h2>
      <p class="updates-version"><span data-i18n="settings.updates.installed">Installed version:</span> <strong id="app-version">…</strong></p>
      <p class="connection-status" id="updates-status" data-i18n="settings.updates.neverChecked">No check performed yet.</p>
      <div class="field-row connect-row">
        <button type="button" class="btn-secondary" id="btn-check-updates" data-i18n="settings.updates.checkNow">Check now</button>
        <button type="button" class="btn-primary" id="btn-download-update" hidden>Download</button>
      </div>
      <p class="hint" id="updates-download-hint" hidden></p>
      <label>
        <input type="checkbox" data-field="updates.autoCheck" />
        <span data-i18n="settings.updates.autoCheck">Check automatically at startup and every 24 hours</span>
      </label>
      <p class="hint" data-i18n="settings.updates.hint"></p>
    </section>

    <section class="card">
      <h2 data-i18n="settings.diagnostics.title">Diagnostics</h2>
      <label>
        <input type="checkbox" data-field="diagnostics.autoReportFormatDrift" />
        <span data-i18n="settings.diagnostics.autoReport">Report automatically if the format of a Claude/Copilot response changes</span>
      </label>
      <p class="hint" data-i18n="settings.diagnostics.hint"></p>
      <div class="field-row">
        <button type="button" class="btn-secondary" id="btn-report-responses" data-i18n="settings.diagnostics.reportResponses" disabled>Report usage responses (GitHub)</button>
      </div>
      <p class="hint" data-i18n="settings.diagnostics.reportResponsesHint"></p>
      <p class="hint" id="report-responses-status" role="status"></p>
    </section>

    <div class="save-bar">
      <button type="button" id="btn-cancel" class="btn-secondary" data-i18n="settings.cancel" disabled>Cancel</button>
      <button type="button" id="btn-save" class="btn-primary" data-i18n="settings.save" disabled>Save settings</button>
      <span class="save-status" id="save-status"></span>
    </div>
  </main>

  <script type="module" src="settings.js"></script>
</body>
</html>
