version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "next"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      minori-e-patch:
        update-types: ["minor", "patch"]
    # Major bumps (Electron, electron-store, eslint…) need coordinated changes:
    # they get a dedicated issue, not a one-package PR.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
