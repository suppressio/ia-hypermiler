name: Cross-platform build

# Runs only on version tags (e.g. v0.1.0) or manually from Actions.
# Packages are both uploaded as run artifacts and attached directly to the GitHub
# Release of the current tag (electron-builder --publish=always, see CLAUDE.md,
# "Build and test").
"on":
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            flag: --mac
            artifact: macos-dmg
          - os: windows-latest
            flag: --win
            artifact: windows-nsis
          - os: ubuntu-latest
            flag: --linux
            artifact: linux-appimage-deb

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Lint with type-aware rules (eslint.config.mjs): a finding blocks the release, like
      # a failing test.
      - name: Lint
        run: npm run lint

      - name: Build + test
        run: npm test

      - name: Package (electron-builder) and publish to the tag Release
        run: npx electron-builder ${{ matrix.flag }} --publish=always
        env:
          # Prevents electron-builder from looking for a signing identity on macOS (no
          # certificate available for this project): unsigned build.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # With --publish=always electron-builder uses this token to attach the packages to
          # the GitHub Release of the current tag (or to create it as a draft if it does not
          # exist yet). Requires the "contents: write" permission set above at job level.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload package as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ia-hypermiler-${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 14
