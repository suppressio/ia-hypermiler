name: Cross-platform build

# Two uses (see CLAUDE.md, "CI"):
# - a version tag (e.g. v0.4.12-beta): release — packages attached to the GitHub
#   Release of the tag (electron-builder --publish=always) and uploaded as artifacts;
# - a manual run (Actions → Run workflow, or `gh workflow run build.yml`): TEST build —
#   version "<package.json version>.dev.<run number>", packages only as run artifacts,
#   no release and therefore no update notification to anyone.
"on":
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            flag: --mac
            artifact: macos-dmg
          - os: windows-latest
            flag: --win
            artifact: windows-nsis
          - os: ubuntu-latest
            flag: --linux
            artifact: linux-appimage-deb

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Lint with type-aware rules (eslint.config.mjs): a finding blocks the release, like
      # a failing test.
      - name: Lint
        run: npm run lint

      - name: Build + test
        run: npm test

      - name: Package (electron-builder) — release on a tag, test build otherwise
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            npx electron-builder ${{ matrix.flag }} --publish=always
          else
            # A newer semver than the release it starts from (0.4.11-beta.dev.5 >
            # 0.4.11-beta) and older than the next one: no spurious update prompt.
            version="$(node -p "require('./package.json').version").dev.${{ github.run_number }}"
            npx electron-builder ${{ matrix.flag }} --publish=never -c.extraMetadata.version="$version"
          fi
        env:
          # Prevents electron-builder from looking for a signing identity on macOS (no
          # certificate available for this project): unsigned build.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # With --publish=always electron-builder uses this token to attach the packages to
          # the GitHub Release of the current tag (or to create it as a draft if it does not
          # exist yet). Requires the "contents: write" permission set above at job level.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload package as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ia-hypermiler-${{ matrix.artifact }}${{ github.ref_type != 'tag' && '-test' || '' }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 14
