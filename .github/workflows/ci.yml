name: CI

# Lint and tests on every PR to next and on every push to it, Linux only: the
# cross-platform packaging matrix stays in build.yml (tags and manual runs).
"on":
  pull_request:
    branches:
      - next
  push:
    branches:
      - next

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build + test
        run: npm test
